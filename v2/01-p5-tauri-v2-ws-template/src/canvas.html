<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 · p5.js WebSocket Output</title>
  <link rel="stylesheet" href="canvas.css" />
</head>
<body>
  <main id="canvas-container" class="canvas-stage">
    <header class="output-hud">
      <div>
        <p>JUNKPILE · V2 · EXAMPLE 01</p>
        <strong>p5.js WebSocket Output</strong>
      </div>
      <div class="output-telemetry">
        <span id="connectionBadge" class="badge pending">CONNECTING</span>
        <span><b id="fpsReadout">0</b> fps</span>
        <span id="sizeReadout">0 × 0</span>
      </div>
    </header>
    <div id="pauseBadge" class="pause-badge hidden">PAUSED</div>
    <div class="output-help">F fullscreen · controls arrive through ws://127.0.0.1:2727</div>
  </main>

  <script src="vendor/p5.min.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
