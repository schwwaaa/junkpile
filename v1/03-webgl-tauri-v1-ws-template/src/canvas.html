<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 · Raw WebGL WebSocket Output</title>
  <link rel="stylesheet" href="canvas.css" />
</head>
<body>
  <main id="canvas-container" class="canvas-stage">
    <canvas id="glcanvas" aria-label="Raw WebGL shader output"></canvas>
    <header class="output-hud">
      <div>
        <p>JUNKPILE · V1 · EXAMPLE 03</p>
        <strong>Raw WebGL WebSocket Output</strong>
        <small id="rendererReadout">Starting WebGL…</small>
      </div>
      <div class="output-telemetry">
        <span id="connectionBadge" class="badge pending">CONNECTING</span>
        <span id="shaderBadge" class="badge pending">COMPILING</span>
        <span><b id="fpsReadout">0</b> fps</span>
        <span id="sizeReadout">0 × 0</span>
      </div>
    </header>
    <div id="pauseBadge" class="pause-badge hidden">PAUSED</div>
    <pre id="errorPanel" class="error-panel hidden"></pre>
    <div class="output-help">F fullscreen · raw uniforms arrive through ws://127.0.0.1:2727</div>
  </main>
  <script src="canvas.js"></script>
</body>
</html>
