[package]
name = "junkpile_10_tauri_v1_midi_input"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["wry"] }
midir = "0.9"
once_cell = "1"
serde = { version = "1", features = ["derive"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

# Keep this standalone example isolated from Cargo workspaces above it.
[workspace]
resolver = "2"
