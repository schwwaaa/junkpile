[package]
name = "junkpile_01_tauri_v1_p5_websocket"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"
tokio-tungstenite = "0.21"
once_cell = "1"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

# Keep this standalone example isolated from Cargo workspaces above it.
[workspace]
resolver = "2"
