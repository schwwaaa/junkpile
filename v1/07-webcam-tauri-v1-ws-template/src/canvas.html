<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07 · Webcam WebSocket Output</title>
  <link rel="stylesheet" href="canvas.css" />
</head>
<body>
  <main id="canvasStage" class="canvas-stage">
    <canvas id="glcanvas" aria-label="Live webcam processed through raw WebGL"></canvas>
    <video id="webcam-video" autoplay playsinline muted></video>

    <header class="output-hud">
      <div>
        <p>JUNKPILE · V1 · EXAMPLE 07</p>
        <strong id="sourceName">Generated calibration source</strong>
        <small id="rendererReadout">Preparing WebGL…</small>
      </div>
      <div class="output-telemetry">
        <span id="connectionBadge" class="badge pending">CONNECTING</span>
        <span id="shaderBadge" class="badge pending">COMPILING</span>
        <span id="cameraBadge" class="badge pending">NO CAMERA</span>
        <span><b id="fpsReadout">0</b> fps</span>
        <span><b id="cameraFpsReadout">0</b> cam</span>
        <span id="sizeReadout">0 × 0</span>
        <span id="inputReadout">0 × 0 input</span>
      </div>
    </header>

    <div id="pauseBadge" class="pause-badge hidden">RENDER PAUSED</div>
    <pre id="errorPanel" class="error-panel hidden" aria-live="polite"></pre>
    <div class="output-help">F fullscreen · camera capture remains in this WebView</div>
  </main>
  <script src="canvas.js"></script>
</body>
</html>
