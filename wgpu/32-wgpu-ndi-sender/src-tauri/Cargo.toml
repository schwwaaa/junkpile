[package]
name = "junkpile_32_wgpu_ndi_sender"
version = "0.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["unstable"] }
wgpu = "29.0.3"
grafton-ndi = { version = "=0.9.0", optional = true }

[features]
default = []
ndi = ["dep:grafton-ndi"]

# Keep this standalone example isolated from Cargo workspaces in parent directories.
[workspace]
