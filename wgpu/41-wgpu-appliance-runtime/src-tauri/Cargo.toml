[package]
name = "junkpile_41_wgpu_appliance_runtime"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
cmake = "0.1"

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
wgpu = "29.0.3"
notify = "6.1"
serde_json = "1"
grafton-ndi = { version = "=0.9.0", optional = true }

[features]
default = []
ndi = ["dep:grafton-ndi"]
syphon = []
spout = []
platform-share = ["syphon", "spout"]

# Keep this standalone example isolated from Cargo workspaces in parent directories.
[workspace]
