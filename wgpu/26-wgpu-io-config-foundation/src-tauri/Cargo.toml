[package]
name = "junkpile_26_wgpu_io_config_foundation"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
notify = "6.1"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
wgpu = "29.0.3"

# Keep this standalone example isolated from Cargo workspaces in parent directories.
[workspace]
