[package]
name = "junkpile_09_wgpu_compute_particles"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", features = ["unstable"] }

# Native backend policy:
# - macOS uses Metal and can optionally expose MoltenVK through the portability feature.
# - Windows/Linux use wgpu's normal native backend set.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=29.0.4", features = ["vulkan-portability"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = "=29.0.4"

# Isolate this example from unrelated Cargo workspaces in parent directories.
[workspace]
